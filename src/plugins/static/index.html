<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pocket-agent</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --line: #d9d2c5;
      --accent: #0b6e4f;
      --cache: #1b7f4e;
      --cache-bg: #e5f6ec;
      --intercept: #9a6b00;
      --intercept-bg: #fff6db;
      --card: #fffdf9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #e7efe8 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem 0.5rem;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    main {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 1rem;
      padding: 1rem 1.5rem 2rem;
      max-width: 1100px;
    }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
    }
    aside, section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.9rem;
    }
    aside h2, section h2 {
      margin: 0 0 0.6rem;
      font-size: 0.95rem;
    }
    #sessions {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 0.85rem;
    }
    #sessions li {
      padding: 0.35rem 0.4rem;
      border-radius: 6px;
      cursor: pointer;
    }
    #sessions li:hover, #sessions li.active {
      background: #eef5f0;
    }
    #log {
      min-height: 360px;
      max-height: 60vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .msg {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.55rem 0.7rem;
      font-size: 0.9rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { background: #f0f4f8; }
    .msg.answer { border-left: 3px solid var(--accent); }
    .msg.tool { font-family: ui-monospace, Consolas, monospace; font-size: 0.82rem; }
    .tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      margin-right: 0.35rem;
      vertical-align: middle;
    }
    .tag.cache {
      color: var(--cache);
      background: var(--cache-bg);
    }
    .tag.intercept {
      color: var(--intercept);
      background: var(--intercept-bg);
    }
    .composer {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.8rem;
    }
    .composer input {
      flex: 1;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .composer button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 0 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    .composer button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    dialog {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      max-width: 420px;
    }
    dialog::backdrop { background: rgba(0,0,0,0.35); }
    dialog menu {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      padding: 0;
      margin: 0.8rem 0 0;
    }
    dialog button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 0.35rem 0.8rem;
      cursor: pointer;
    }
    dialog button.ok {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <h1>pocket-agent</h1>
    <p>本地小模型工具调用 · 流式步骤 / 缓存命中 / 写操作审批</p>
  </header>
  <main>
    <aside>
      <h2>会话</h2>
      <ul id="sessions"></ul>
      <button id="refresh" type="button" style="margin-top:0.6rem;width:100%">刷新列表</button>
    </aside>
    <section>
      <h2>对话 <span id="sidLabel" style="color:var(--muted);font-weight:400"></span></h2>
      <div id="log"></div>
      <form class="composer" id="form">
        <input id="input" placeholder="例如：查询北京和上海的天气并告诉我温差" autocomplete="off" />
        <button id="send" type="submit">发送</button>
      </form>
    </section>
  </main>

  <dialog id="approveDlg">
    <h3 style="margin:0 0 0.4rem;font-size:1rem">写操作需要确认</h3>
    <p id="approveText" style="margin:0;color:var(--muted);font-size:0.9rem"></p>
    <menu>
      <button type="button" id="approveNo">拒绝</button>
      <button type="button" class="ok" id="approveYes">批准</button>
    </menu>
  </dialog>

  <script>
    const logEl = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const sessionsEl = document.getElementById("sessions");
    const sidLabel = document.getElementById("sidLabel");
    const dlg = document.getElementById("approveDlg");
    const approveText = document.getElementById("approveText");
    let sessionId = "default";
    let es = null;
    let approvalTimer = null;
    let pendingApprovalId = null;

    function setSession(id) {
      sessionId = id || "default";
      sidLabel.textContent = "· " + sessionId;
      [...sessionsEl.querySelectorAll("li")].forEach((li) => {
        li.classList.toggle("active", li.dataset.id === sessionId);
      });
    }

    function appendMsg(cls, html) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.innerHTML = html;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
      return div;
    }

    async function refreshSessions() {
      const res = await fetch("/sessions");
      const rows = await res.json();
      sessionsEl.innerHTML = "";
      if (!rows.length) {
        const li = document.createElement("li");
        li.textContent = "（暂无）";
        sessionsEl.appendChild(li);
      }
      for (const row of rows) {
        const li = document.createElement("li");
        li.dataset.id = row.session_id;
        li.textContent = row.session_id + " · " + row.turns + " 轮";
        li.onclick = () => setSession(row.session_id);
        sessionsEl.appendChild(li);
      }
      setSession(sessionId);
    }

    async function resolveApproval(approved) {
      if (!pendingApprovalId) return;
      const id = pendingApprovalId;
      pendingApprovalId = null;
      if (approvalTimer) {
        clearTimeout(approvalTimer);
        approvalTimer = null;
      }
      dlg.close();
      await fetch("/approve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ approval_id: id, approved }),
      });
    }

    function onApproval(data) {
      pendingApprovalId = data.approval_id;
      const timeout = (data.timeout_sec || 60) * 1000;
      approveText.textContent =
        "工具 " + data.tool + "\n参数 " + JSON.stringify(data.args || {}, null, 0) +
        "\n\n" + (timeout / 1000) + " 秒内未确认将默认拒绝。";
      dlg.showModal();
      if (approvalTimer) clearTimeout(approvalTimer);
      approvalTimer = setTimeout(() => resolveApproval(false), timeout);
    }

    document.getElementById("approveYes").onclick = () => resolveApproval(true);
    document.getElementById("approveNo").onclick = () => resolveApproval(false);
    document.getElementById("refresh").onclick = () => refreshSessions();

    function handleEvent(event, data) {
      if (event === "step.tool_call") {
        appendMsg(
          "tool",
          "<strong>" + escapeHtml(data.tool) + "</strong> " +
          escapeHtml(JSON.stringify(data.args || {})) +
          (data.error ? "<br/>⚠ " + escapeHtml(data.error) : "")
        );
      } else if (event === "step.cache_hit") {
        appendMsg(
          "tool",
          '<span class="tag cache">cache_hit</span>' +
          "<strong>" + escapeHtml(data.tool) + "</strong> " +
          escapeHtml(JSON.stringify(data.args || {}))
        );
      } else if (event === "step.intercepted") {
        appendMsg(
          "tool",
          '<span class="tag intercept">intercepted</span>' +
          escapeHtml(data.reason || "") +
          (data.tool ? " · " + escapeHtml(data.tool) : "")
        );
      } else if (event === "answer.done") {
        appendMsg("answer", escapeHtml(data.answer || ""));
      } else if (event === "approval.required") {
        onApproval(data);
      } else if (event === "error") {
        appendMsg("tool", "错误：" + escapeHtml(data.message || ""));
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    form.onsubmit = (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      if (es) {
        es.close();
        es = null;
      }
      appendMsg("user", escapeHtml(text));
      input.value = "";
      sendBtn.disabled = true;

      const url =
        "/chat?session_id=" + encodeURIComponent(sessionId) +
        "&message=" + encodeURIComponent(text);
      es = new EventSource(url);

      const names = [
        "step.start",
        "step.tool_call",
        "step.cache_hit",
        "step.intercepted",
        "answer.done",
        "approval.required",
        "error",
      ];
      for (const name of names) {
        es.addEventListener(name, (ev) => {
          try {
            handleEvent(name, JSON.parse(ev.data));
          } catch (_) {}
        });
      }
      es.onerror = () => {
        es.close();
        es = null;
        sendBtn.disabled = false;
        refreshSessions();
      };
      // answer.done 后服务端关闭流，onerror 会触发；也主动收尾
      es.addEventListener("answer.done", () => {
        setTimeout(() => {
          if (es) {
            es.close();
            es = null;
          }
          sendBtn.disabled = false;
          refreshSessions();
        }, 50);
      });
    };

    setSession(sessionId);
    refreshSessions();
  </script>
</body>
</html>
