# headless：跳过 ui-web；web：加载 UI（浏览器 http://127.0.0.1:3000）
# 启动 Web：python cli.py serve --profile web
# 或将下方改为 profile: web 后执行：python cli.py serve
profile: headless
plugins:
  - name: prompts
  - name: agents
    config:
      agents_root: "agents"
  - name: llm-llamacpp
    config:
      base_url: "http://localhost:8000/v1"
  - name: tools-core
  - name: knowledge-base
    config:
      # hash：无 extras 也可入库检索；local：bge-small-zh（需 pocket-agent[knowledge]）
      embedder: hash
      db_path: ".knowledge/kb.sqlite"
      searxng_url: ""
      serper_key: ""
  # MCP 桥接：启用后把外部 MCP tools 注册为 mcp_*（需本机有对应 server）
  # 示例（mock）：
  #   mcp_servers:
  #     - name: echo
  #       transport: stdio
  #       command: python
  #       args: ["scripts/mock_mcp_echo.py"]
  - name: bridge-mcp
    disabled: true
    config:
      mcp_servers: []
  - name: checkpoint
  - name: agent-loop
  - name: orchestrator
  - name: session
  - name: writer
  - name: ui-cli
  - name: ui-web
    config:
      host: "127.0.0.1"
      port: 3000
