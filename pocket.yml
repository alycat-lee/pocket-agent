# headless：自动跳过 ui-web；切 profile: web 后浏览器访问 http://127.0.0.1:3000
# 启动：python cli.py serve
profile: headless
plugins:
  - name: llm-llamacpp
    config:
      base_url: "http://localhost:8000/v1"
  # 启用云端混合路由时：将本项 disabled 改为 false，并为 llm-llamacpp 加 local_only: true
  - name: llm-deepseek
    disabled: true
    config:
      api_key_env: DEEPSEEK_API_KEY
      route: true
  - name: tools-core
  # MCP 桥接：启用后把外部 MCP tools 注册为 mcp_*（需本机有对应 server）
  # 示例（mock）：
  #   mcp_servers:
  #     - name: echo
  #       transport: stdio
  #       command: python
  #       args: ["scripts/mock_mcp_echo.py"]
  - name: bridge-mcp
    disabled: true
    config:
      mcp_servers: []
  - name: checkpoint
  - name: agent-loop
  - name: session
  - name: writer
  - name: ui-cli
  - name: ui-web
    config:
      host: "127.0.0.1"
      port: 3000
