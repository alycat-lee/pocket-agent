# headless：不含 ui-web；CLI / 演示默认装配
profile: headless
plugins:
  - name: llm-llamacpp
    config:
      base_url: "http://localhost:8000/v1"
  # 启用云端混合路由时：将本项 disabled 改为 false，并为 llm-llamacpp 加 local_only: true
  - name: llm-deepseek
    disabled: true
    config:
      api_key_env: DEEPSEEK_API_KEY
      route: true
  - name: tools-core
  - name: checkpoint
  - name: agent-loop
  - name: session
  - name: writer
  - name: ui-cli
