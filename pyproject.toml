[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-agent"
version = "0.1.0"
description = "Tool-calling agent framework for local small models on 8GB VRAM"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools]
package-dir = {"pocket_agent" = "src"}
packages = [
    "pocket_agent",
    "pocket_agent.config",
    "pocket_agent.llm_client",
    "pocket_agent.tools",
    "pocket_agent.demo_tools",
    "pocket_agent.ledger",
    "pocket_agent.compressor",
    "pocket_agent.prompts",
    "pocket_agent.guard",
    "pocket_agent.runner",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 缓存每次清空；临时目录放到仓库内，便于 scripts/clean.py 清理
addopts = "--cache-clear --basetemp=.pytest_tmp"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
