[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-agent"
version = "0.1.0"
description = "Tool-calling agent framework for local small models on 8GB VRAM"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "pydantic",
    "pyyaml",
]

[project.optional-dependencies]
web = [
    "fastapi",
    "uvicorn",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "fastapi",
    "uvicorn",
]
knowledge = [
    "sentence-transformers",
]
tui = [
    "prompt_toolkit>=3.0",
]

[tool.setuptools]
package-dir = {"pocket_agent" = "src"}
packages = [
    "pocket_agent",
    "pocket_agent.config",
    "pocket_agent.config_schema",
    "pocket_agent.events",
    "pocket_agent.llm_client",
    "pocket_agent.tools",
    "pocket_agent.providers",
    "pocket_agent.ledger",
    "pocket_agent.compressor",
    "pocket_agent.prompts",
    "pocket_agent.prompt_registry",
    "pocket_agent.orchestrator",
    "pocket_agent.guard",
    "pocket_agent.agents",
    "pocket_agent.knowledge",
    "pocket_agent.runner",
    "pocket_agent.session",
    "pocket_agent.checkpoint",
    "pocket_agent.writer",
    "pocket_agent.runtime",
    "pocket_agent.plugins",
]

[tool.setuptools.package-data]
"pocket_agent.plugins" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 缓存每次清空；临时目录放到仓库内，便于 scripts/clean.py 清理
addopts = "--cache-clear --basetemp=.pytest_tmp"
markers = [
    "integration: 需要 llama-server 的真机集成测试",
    "stress: 专项压测，默认跳过",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
